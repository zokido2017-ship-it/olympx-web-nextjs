# Reverse proxy for Olympx Next.js.
# install.sh copies this to /etc/nginx/sites-available/olympx and replaces
# __SERVER_NAME__ with your domain (or _). Certbot can then add TLS.
# Included from nginx.conf inside the http {} block.

map $http_upgrade $olympx_connection_upgrade {
    default upgrade;
    ''      "";
}

upstream olympx_next {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    client_max_body_size 10m;

    location / {
        proxy_pass http://olympx_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $olympx_connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
